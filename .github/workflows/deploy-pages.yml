name: Build and Deploy Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare site folder
        run: |
          set -e
          rm -rf site || true
          mkdir -p site
          # Copy any static HTML or assets from src
          if [ -d "src" ]; then cp -R src/* site/ || true; fi
          # Copy built output (dist) if present
          if [ -d "dist" ]; then cp -R dist/* site/ || true; fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
